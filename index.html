<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>friday</title>
    <style>
        body {
            font-family: sans-serif;
            line-height: 1.7;
            margin: 0;
            padding: 24px;
            background: #f7f7f7;
            color: #222;
        }

        .profile {
            max-width: 640px;
            margin: 0 auto;
            padding: 24px;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
        }

        h1 {
            margin-top: 0;
            font-size: 28px;
        }

        dl {
            margin: 0;
        }

        dt {
            font-weight: 700;
            margin-top: 12px;
        }

        dd {
            margin: 4px 0 0;
        }
    </style>
</head>
<body>
    <main class="profile">
        <h1>プロフィール</h1>
        <dl>
            <dt>名前</dt>
            <dd>わをん</dd>

            <dt>ひとこと</dt>
            <dd>AIと仲良くなりたいな</dd>

            <dt>得意なこと</dt>
            <dd>ないよ</dd>

            <dt>趣味</dt>
            <dd>映像作品鑑賞、観劇、読書、ゲーム、ダンス</dd>

            <dt>大事にしていること</dt>
            <dd>綾鷹</dd>

            <dt>最近会った嫌なこと</dt>
            <dd>PASMO失くした</dd>

            <dt>SNS</dt>
            <dd>そんなものある</dd>
        </dl>
    </main>
</body>
</html>
